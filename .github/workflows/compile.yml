name: Compile EaglerForge Client
on: [workflow_dispatch] # Allows you to press a button to start the build

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Compile Game
        run: |
          ./CompileLatestClient.bat --headless
        # Note: Headless bypasses the installer GUI so GitHub can build it automatically

      - name: Upload HTML Game File
        uses: actions/upload-artifact@v4
        with:
          name: EaglerForge-Offline-Client
          path: ./**/*.html
